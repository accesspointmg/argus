# =============================================================================
# VERIFY WORKFLOW
# =============================================================================
# Triggered on ANY commit to ANY branch.
# Pipeline: install → compile → lint → type check → trial package
#
# Runner Strategy:
#   - Pushes and PRs from branches in this repo: always-on Mac server (self-hosted),
#     sharing a concurrency group with o3de-pilot to prevent resource contention.
#   - PRs from forks: GitHub-hosted runner. This repo is public, so a fork PR is
#     arbitrary code from anyone and must never run on the self-hosted Mac.
#
# Mirrors the o3de-pilot CI pattern: self-hosted runners, external drive
# artifacts, path filters for efficiency.
# =============================================================================

name: Verify Build

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.eslintrc*'
      - '.vscodeignore'
      - 'media/**'
      - '.github/workflows/ci.yml'
  # No path filter on PRs: branch rules require these checks, so they must always report.
  pull_request:
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: 'Force rebuild (ignore cache)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

# Self-hosted runs share a group with o3de-pilot — queue, don't cancel.
# Fork PRs run on GitHub-hosted runners and don't need to queue behind them.
concurrency:
  group: ${{ (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && format('fork-pr-{0}', github.event.pull_request.number) || 'self-hosted-builds' }}
  cancel-in-progress: false

env:
  ARTIFACT_PATH: artifacts/github/${{ github.repository }}/verify/${{ github.sha }}

jobs:
  # ===========================================================================
  # STAGE 1: VALIDATE (Lint, Type Check, Compile)
  # ===========================================================================
  validate:
    name: "Lint & Type Check"
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && '["ubuntu-latest"]' || '["self-hosted","macOS"]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: runner.environment == 'github-hosted'
        with:
          node-version: 20

      - name: Verify Node.js
        run: |
          echo "Node: $(node --version)"
          echo "npm:  $(npm --version)"

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run compile

      - name: Lint
        run: npm run lint

      - name: Type check (strict)
        run: npx tsc --noEmit

  # ===========================================================================
  # STAGE 2: TRIAL PACKAGE
  # ===========================================================================
  # vsce package validates the extension manifest, icon, README, etc.
  # This catches marketplace issues before release.
  trial-package:
    name: "Trial Package"
    needs: [validate]
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && '["ubuntu-latest"]' || '["self-hosted","macOS"]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: runner.environment == 'github-hosted'
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Check for existing build
        id: cache
        if: runner.environment == 'self-hosted' && github.event.inputs.force_rebuild != 'true'
        run: |
          if [ -f "$HOME/${{ env.ARTIFACT_PATH }}/argus-verify.vsix" ]; then
            echo "✅ Found existing build — skipping"
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "📦 No existing build found, will build fresh"
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Build .vsix
        if: steps.cache.outputs.exists != 'true'
        run: npx vsce package --no-git-tag-version -o argus-verify.vsix

      - name: Save to external drive
        if: runner.environment == 'self-hosted' && steps.cache.outputs.exists != 'true'
        run: |
          mkdir -p "$HOME/${{ env.ARTIFACT_PATH }}"
          cp argus-verify.vsix "$HOME/${{ env.ARTIFACT_PATH }}/"
          echo "✅ Saved to: $HOME/${{ env.ARTIFACT_PATH }}/argus-verify.vsix"
          ls -lh "$HOME/${{ env.ARTIFACT_PATH }}/argus-verify.vsix"

      - name: Report cache hit
        if: steps.cache.outputs.exists == 'true'
        run: echo "✅ Build already exists for ${{ github.sha }}"

  # ===========================================================================
  # VERIFICATION COMPLETE
  # ===========================================================================
  verify-complete:
    name: "✓ Verification Complete"
    needs: [validate, trial-package]
    runs-on: ${{ fromJSON((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) && '["ubuntu-latest"]' || '["self-hosted","macOS"]') }}
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Argus Verify Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Stage | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint & Type Check | ${{ needs.validate.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Trial Package | ${{ needs.trial-package.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
