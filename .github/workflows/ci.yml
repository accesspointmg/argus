# =============================================================================
# VERIFY WORKFLOW
# =============================================================================
# Triggered on pushes to any branch and on every pull request.
# Pipeline: install → compile → lint → type check → trial package
#
# Runs on GitHub-hosted runners only. This repository is public: a pull
# request from a fork can edit this file, so nothing here may run on a
# self-hosted machine. (The org runner group excludes this repo as well.)
# =============================================================================

name: Verify Build

on:
  push:
    branches:
      - '**'
    tags-ignore:
      - '**'
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'
      - '.eslintrc*'
      - '.vscodeignore'
      - 'media/**'
      - '.github/workflows/ci.yml'
  # No path filter on PRs: branch rules require these checks, so they must always report.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # STAGE 1: VALIDATE (Lint, Type Check, Compile)
  # ===========================================================================
  validate:
    name: "Lint & Type Check"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run compile

      - name: Lint
        run: npm run lint

      - name: Type check (strict)
        run: npx tsc --noEmit

  # ===========================================================================
  # STAGE 2: TRIAL PACKAGE
  # ===========================================================================
  # vsce package validates the extension manifest, icon, README, etc.
  # This catches marketplace issues before release.
  trial-package:
    name: "Trial Package"
    needs: [validate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build .vsix
        run: npx vsce package --no-git-tag-version -o argus-verify.vsix

      - name: Upload .vsix
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: argus-verify-${{ github.sha }}
          path: argus-verify.vsix
          retention-days: 7
