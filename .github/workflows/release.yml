# =============================================================================
# RELEASE WORKFLOW
# =============================================================================
# Runs for a pushed v* tag (or manually, for a tag that already exists).
#
# Pipeline:
#   1. Pre-flight: tag must be on main; skip if this commit was already released
#   2. Install → compile → lint → type check → build .vsix
#   3. Create GitHub Release with the .vsix attached
#   4. Publish to the VS Code Marketplace (environment `marketplace`, VSCE_PAT)
#
# GitHub-hosted runners only: this repository is public.
#
# To release (repo admins only — `v*` tags are protected by a ruleset):
#   1. On development, bump the version and push:
#        npm version patch|minor|major --no-git-tag-version && git commit -am "release: v<version>"
#   2. Merge development into main via PR (main accepts no direct pushes)
#   3. Tag main and push the tag:
#        git fetch origin && git tag v<version> origin/main && git push origin v<version>
#
# workflow_dispatch works only for a tag an admin has already pushed: the
# workflow's own token cannot create `v*` tags.
# =============================================================================

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_marketplace:
        description: 'Publish to VS Code Marketplace'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ===========================================================================
  # PRE-FLIGHT CHECKS
  # ===========================================================================
  preflight:
    name: Pre-flight Checks
    runs-on: ubuntu-latest
    outputs:
      already_released: ${{ steps.release_check.outputs.already_released }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Require a v* tag
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) echo "✓ Releasing ${GITHUB_REF#refs/tags/}" ;;
            *) echo "::error::Run this workflow on a v* tag (got $GITHUB_REF)"; exit 1 ;;
          esac

      - name: Validate tag is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF#refs/tags/} points at a commit that is not on main. Releases must come from main."
            exit 1
          fi
          echo "✓ Tagged commit is on main"

      - name: Check if already released
        id: release_check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF#refs/tags/}" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "✅ Release ${GITHUB_REF#refs/tags/} already exists — nothing to do"
            echo "already_released=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_released=false" >> "$GITHUB_OUTPUT"
          fi

  # ===========================================================================
  # BUILD & PACKAGE
  # ===========================================================================
  build:
    name: "Build .vsix"
    needs: [preflight]
    if: needs.preflight.outputs.already_released != 'true'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      vsix_name: ${{ steps.package.outputs.vsix_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Resolve version
        id: version
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag v$VERSION does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "📦 Release version: $VERSION"

      - name: Install dependencies
        run: npm ci

      - name: Compile TypeScript
        run: npm run compile

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build .vsix
        id: package
        run: |
          VSIX_NAME="argus-issue-agent-${{ steps.version.outputs.version }}.vsix"
          npx vsce package --no-git-tag-version -o "$VSIX_NAME"
          echo "vsix_name=$VSIX_NAME" >> "$GITHUB_OUTPUT"
          ls -lh "$VSIX_NAME"

      - name: Upload .vsix
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vsix
          path: ${{ steps.package.outputs.vsix_name }}
          retention-days: 30

  # ===========================================================================
  # GITHUB RELEASE
  # ===========================================================================
  release:
    name: "Create GitHub Release"
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: Argus v${{ needs.build.outputs.version }}
          body: |
            **Install manually:** download `${{ needs.build.outputs.vsix_name }}` below, then in VS Code:
            **Extensions** → **⋯** → **Install from VSIX…**

            Or from the [VS Code Marketplace](https://marketplace.visualstudio.com/items?itemName=accesspointmediagroupllc.argus-issue-agent).
          files: ${{ needs.build.outputs.vsix_name }}
          draft: false
          prerelease: ${{ contains(needs.build.outputs.version, '-') }}
          generate_release_notes: true

  # ===========================================================================
  # MARKETPLACE PUBLISH
  # ===========================================================================
  publish:
    name: "Publish to Marketplace"
    needs: [build, release]
    if: github.event_name == 'push' || inputs.publish_marketplace == true
    runs-on: ubuntu-latest
    # The environment only allows v* tags. Publishing signs in with Microsoft
    # Entra ID (workload identity federation): GitHub proves this job's identity,
    # so no token is stored. Global PATs stop working on 2026-12-01; VSCE_PAT is
    # only a fallback until the Entra identity is configured.
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      # vsce from the lockfile, not whatever npm serves today.
      - name: Install dependencies
        run: npm ci

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix

      # Environment variables (not secrets) on `marketplace`: AZURE_CLIENT_ID, AZURE_TENANT_ID.
      - name: Sign in to Microsoft Entra ID
        if: vars.AZURE_CLIENT_ID != ''
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Publish
        env:
          USE_ENTRA: ${{ vars.AZURE_CLIENT_ID != '' }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VSIX: ${{ needs.build.outputs.vsix_name }}
        run: |
          if [ "$USE_ENTRA" = "true" ]; then
            npx vsce publish --azure-credential --packagePath "$VSIX"
          elif [ -n "$VSCE_PAT" ]; then
            echo "::warning::Publishing with VSCE_PAT. Global PATs stop working on 2026-12-01 — configure Entra ID."
            npx vsce publish --pat "$VSCE_PAT" --packagePath "$VSIX"
          else
            echo "::error::No Marketplace credentials: set AZURE_CLIENT_ID/AZURE_TENANT_ID on the marketplace environment."
            exit 1
          fi
          echo "✅ Published to marketplace"
