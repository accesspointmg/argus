# Keeps pinned GitHub Actions and npm dependencies current.
# PRs target development, like every other change.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    target-branch: development
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      # Must not exceed engines.vscode in package.json (vsce rejects the package
      # otherwise). Raise both together, deliberately.
      - dependency-name: "@types/vscode"
    groups:
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
